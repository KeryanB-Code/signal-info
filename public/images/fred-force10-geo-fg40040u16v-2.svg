<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F0EBE2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="430" rx="240" ry="22" fill="url(#shadow)"/>
  <!-- Glasses centered -->
  
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-opacity="0.2"/></filter>
  </defs>
  <!-- Left lens -->
  <rect x="110" y="255" width="240" height="135" rx="3" ry="3" fill="rgba(175,175,175,0.18)" stroke="#AFAFAF" stroke-width="6" filter="url(#sh)"/>
  <!-- Right lens -->
  <rect x="450" y="255" width="240" height="135" rx="3" ry="3" fill="rgba(175,175,175,0.18)" stroke="#AFAFAF" stroke-width="6" filter="url(#sh)"/>
  <!-- Bridge -->
  <rect x="350" y="303" width="100" height="8" rx="3" fill="#AFAFAF"/>
  <!-- Left temple -->
  <line x1="110" y1="312" x2="30" y2="322" stroke="#AFAFAF" stroke-width="6" stroke-linecap="square"/>
  <!-- Right temple -->
  <line x1="690" y1="312" x2="770" y2="322" stroke="#AFAFAF" stroke-width="6" stroke-linecap="square"/>
  <!-- Reflection -->
  <line x1="135" y1="270" x2="195" y2="267" stroke="white" stroke-width="2" stroke-opacity="0.5"/>
  <line x1="475" y1="270" x2="535" y2="267" stroke="white" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Product name -->
  <text x="400" y="530" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="12" letter-spacing="0.25em" fill="#8B6914" opacity="0.55" font-weight="300">Force 10 Geometric</text>
  <text x="400" y="550" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.4em" fill="#A0896A" opacity="0.45" font-weight="300">FRED</text>
</svg>