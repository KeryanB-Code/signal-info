<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="35%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2A2520"/>
      <stop offset="100%" stop-color="#1A1614"/>
    </radialGradient>
    <radialGradient id="glow" cx="40%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#C4A882" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C4A882" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="340" cy="290" rx="320" ry="260" fill="url(#glow)"/>
  <!-- Glasses, slightly larger (scale 1.15 from center) -->
  <g transform="translate(400,300) scale(1.18) translate(-400,-300)">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Left lens (teardrop aviator) -->
  <path d="M 148,270 Q 240,240 340,280 Q 355,310 340,345 Q 270,390 180,380 Q 120,360 120,320 Q 120,290 148,270 Z"
        fill="rgba(201,168,76,0.18)" stroke="url(#lg)" stroke-width="3" filter="url(#sh)"/>
  <!-- Right lens -->
  <path d="M 460,280 Q 560,240 652,270 Q 680,290 680,320 Q 680,360 620,380 Q 530,390 460,345 Q 445,310 460,280 Z"
        fill="rgba(201,168,76,0.18)" stroke="url(#lg)" stroke-width="3" filter="url(#sh)"/>
  <!-- Double bridge top -->
  <path d="M 340,278 Q 400,265 460,278" fill="none" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
  <!-- Double bridge bottom -->
  <path d="M 342,295 Q 400,283 458,295" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
  <!-- Left temple -->
  <line x1="125" y1="315" x2="35" y2="330" stroke="#C9A84C" stroke-width="4" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="675" y1="315" x2="765" y2="330" stroke="#C9A84C" stroke-width="4" stroke-linecap="round"/>
  <!-- Reflection -->
  <line x1="165" y1="265" x2="215" y2="258" stroke="white" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="480" y1="258" x2="530" y2="265" stroke="white" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/></g>
  <!-- Brand signature bottom right -->
  <text x="740" y="576" text-anchor="end" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.35em" fill="#C4A882" opacity="0.6" font-weight="300">CARTIER</text>
</svg>