<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F0EBE2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="430" rx="240" ry="22" fill="url(#shadow)"/>
  <!-- Glasses centered -->
  
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Left lens (circle) -->
  <circle cx="248" cy="308" r="105" fill="rgba(201,168,76,0.18)" stroke="#C9A84C" stroke-width="5" filter="url(#sh)"/>
  <!-- Right lens -->
  <circle cx="552" cy="308" r="105" fill="rgba(201,168,76,0.18)" stroke="#C9A84C" stroke-width="5" filter="url(#sh)"/>
  <!-- Bridge -->
  <path d="M 353,295 Q 400,280 447,295" fill="none" stroke="#C9A84C" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left temple -->
  <line x1="144" y1="308" x2="40" y2="320" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="656" y1="308" x2="760" y2="320" stroke="#C9A84C" stroke-width="5" stroke-linecap="round"/>
  <!-- Nose pads -->
  <ellipse cx="365" cy="302" rx="5" ry="7" fill="#C9A84C" opacity="0.7"/>
  <ellipse cx="435" cy="302" rx="5" ry="7" fill="#C9A84C" opacity="0.7"/>
  <!-- Reflection arc -->
  <path d="M 190,280 Q 215,265 245,278" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M 494,280 Q 519,265 549,278" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/>
  <!-- Product name -->
  <text x="400" y="530" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="12" letter-spacing="0.25em" fill="#8B6914" opacity="0.55" font-weight="300">Medusa Round</text>
  <text x="400" y="550" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.4em" fill="#A0896A" opacity="0.45" font-weight="300">VERSACE</text>
</svg>