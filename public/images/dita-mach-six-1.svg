<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#EDE5D8"/>
      <stop offset="100%" stop-color="#D4C4B0"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E8D9C5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C4A882" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Subtle face glow -->
  <ellipse cx="400" cy="240" rx="200" ry="260" fill="url(#face)"/>
  <!-- Face silhouette (very subtle) -->
  <ellipse cx="400" cy="200" rx="140" ry="170" fill="#C9B49A" opacity="0.12"/>
  <!-- Neck -->
  <rect x="358" y="360" width="84" height="130" rx="42" fill="#C9B49A" opacity="0.10"/>
  <!-- Shoulders -->
  <path d="M 160,480 Q 280,430 400,440 Q 520,430 640,480 L 640,600 L 160,600 Z" fill="#C9B49A" opacity="0.10"/>
  <!-- Glasses -->
  <g transform="translate(0, 80)">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="1"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.14"/></filter>
  </defs>
  <!-- Left lens (rectangular narrow) -->
  <rect x="125" y="278" width="215" height="95" rx="3" ry="3" fill="rgba(201,168,76,0.18)" stroke="url(#lg)" stroke-width="2.5" filter="url(#sh)"/>
  <!-- Right lens -->
  <rect x="460" y="278" width="215" height="95" rx="3" ry="3" fill="rgba(201,168,76,0.18)" stroke="url(#lg)" stroke-width="2.5" filter="url(#sh)"/>
  <!-- Double brow bar top gauche -->
  <rect x="125" y="262" width="215" height="5" rx="2" fill="#C9A84C"/>
  <!-- Double brow bar top droit -->
  <rect x="460" y="262" width="215" height="5" rx="2" fill="#C9A84C"/>
  <!-- Double brow bar secondaire (légèrement en dessous) -->
  <rect x="125" y="271" width="215" height="3" rx="1" fill="#C9A84C" opacity="0.55"/>
  <rect x="460" y="271" width="215" height="3" rx="1" fill="#C9A84C" opacity="0.55"/>
  <!-- Bridge fin -->
  <rect x="340" y="292" width="120" height="4" rx="2" fill="#C9A84C"/>
  <!-- Vis hexagonales gauche (jonction charnière) -->
  <polygon points="128,278 136,273 144,278 144,287 136,292 128,287" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <circle cx="136" cy="283" r="2" fill="#C9A84C"/>
  <!-- Vis hexagonales droit -->
  <polygon points="656,278 664,273 672,278 672,287 664,292 656,287" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <circle cx="664" cy="283" r="2" fill="#C9A84C"/>
  <!-- Left temple (très fin) -->
  <line x1="127" y1="320" x2="38" y2="330" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="673" y1="320" x2="762" y2="330" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Nose pads precision -->
  <ellipse cx="350" cy="302" rx="4" ry="6" fill="#C9A84C" opacity="0.7"/>
  <ellipse cx="450" cy="302" rx="4" ry="6" fill="#C9A84C" opacity="0.7"/>
  <!-- Reflection -->
  <line x1="150" y1="288" x2="198" y2="285" stroke="white" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="485" y1="288" x2="533" y2="285" stroke="white" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/></g>
  <!-- Brand name -->
  <text x="400" y="560" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="11" letter-spacing="0.3em" fill="#8B6914" opacity="0.7" font-weight="400">DITA</text>
  <!-- Subtle grain texture simulation via noise pattern -->
  <rect width="800" height="600" fill="url(#bg)" opacity="0.04"/>
</svg>