<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F0EBE2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="430" rx="240" ry="22" fill="url(#shadow)"/>
  <!-- Glasses centered -->
  
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.2"/></filter>
  </defs>
  <!-- Single shield lens -->
  <path d="M 90,270 Q 200,240 400,242 Q 600,240 710,270 Q 730,300 710,350 Q 600,390 400,392 Q 200,390 90,350 Q 70,300 90,270 Z"
        fill="rgba(201,168,76,0.18)" stroke="#C9A84C" stroke-width="5" filter="url(#sh)"/>
  <!-- Center divider (nose bridge integrated) -->
  <path d="M 370,242 Q 400,280 370,360" fill="none" stroke="#C9A84C" stroke-width="3" opacity="0.4"/>
  <path d="M 430,242 Q 400,280 430,360" fill="none" stroke="#C9A84C" stroke-width="3" opacity="0.4"/>
  <!-- Left temple -->
  <line x1="93" y1="305" x2="25" y2="320" stroke="#C9A84C" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="707" y1="305" x2="775" y2="320" stroke="#C9A84C" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Cable detail (Fred signature) -->
  <path d="M 93,295 Q 70,300 60,315" fill="none" stroke="#C9A84C" stroke-width="2" stroke-dasharray="3,2" opacity="0.6"/>
  <!-- Reflection sweep -->
  <path d="M 130,265 Q 250,253 400,256 Q 550,253 670,265" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/>
  <!-- Product name -->
  <text x="400" y="530" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="12" letter-spacing="0.25em" fill="#8B6914" opacity="0.55" font-weight="300">LV Discovery PM</text>
  <text x="400" y="550" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.4em" fill="#A0896A" opacity="0.45" font-weight="300">LOUIS VUITTON</text>
</svg>