<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#EDE5D8"/>
      <stop offset="100%" stop-color="#D4C4B0"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E8D9C5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C4A882" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Subtle face glow -->
  <ellipse cx="400" cy="240" rx="200" ry="260" fill="url(#face)"/>
  <!-- Face silhouette (very subtle) -->
  <ellipse cx="400" cy="200" rx="140" ry="170" fill="#C9B49A" opacity="0.12"/>
  <!-- Neck -->
  <rect x="358" y="360" width="84" height="130" rx="42" fill="#C9B49A" opacity="0.10"/>
  <!-- Shoulders -->
  <path d="M 160,480 Q 280,430 400,440 Q 520,430 640,480 L 640,600 L 160,600 Z" fill="#C9B49A" opacity="0.10"/>
  <!-- Glasses -->
  <g transform="translate(0, 80)">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1C1E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1C1C1E" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.22"/></filter>
  </defs>
  <!-- Left lens (square thick) -->
  <rect x="118" y="255" width="220" height="175" rx="4" ry="4" fill="rgba(28,28,30,0.18)" stroke="url(#lg)" stroke-width="13" filter="url(#sh)"/>
  <!-- Right lens -->
  <rect x="462" y="255" width="220" height="175" rx="4" ry="4" fill="rgba(28,28,30,0.18)" stroke="url(#lg)" stroke-width="13" filter="url(#sh)"/>
  <!-- Bridge (slim) -->
  <rect x="338" y="326" width="124" height="10" rx="4" fill="#1C1C1E" opacity="0.9"/>
  <!-- Charnière titane gauche (barre métallique) -->
  <rect x="107" y="330" width="22" height="8" rx="2" fill="#B0B0B8" opacity="0.95"/>
  <!-- Charnière titane droite -->
  <rect x="671" y="330" width="22" height="8" rx="2" fill="#B0B0B8" opacity="0.95"/>
  <!-- Left temple -->
  <line x1="119" y1="338" x2="35" y2="348" stroke="#1C1C1E" stroke-width="11" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="681" y1="338" x2="765" y2="348" stroke="#1C1C1E" stroke-width="11" stroke-linecap="round"/>
  <!-- Lens reflection -->
  <line x1="146" y1="272" x2="205" y2="269" stroke="white" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="490" y1="272" x2="549" y2="269" stroke="white" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/></g>
  <!-- Brand name -->
  <text x="400" y="560" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="11" letter-spacing="0.3em" fill="#8B6914" opacity="0.7" font-weight="400">JOHN DALIA</text>
  <!-- Subtle grain texture simulation via noise pattern -->
  <rect width="800" height="600" fill="url(#bg)" opacity="0.04"/>
</svg>