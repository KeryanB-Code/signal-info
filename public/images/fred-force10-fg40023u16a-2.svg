<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="82%" r="38%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="390" rx="260" ry="18" fill="url(#shadow)"/>
  <!-- Glasses — scaled 1.5x from center to fill frame -->
  <g transform="translate(400,295) scale(1.5) translate(-400,-295)">
    
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.17"/></filter>
  </defs>
  <!-- Left lens -->
  <rect x="115" y="260" width="225" height="120" rx="12" ry="12" fill="rgba(140,140,140,0.18)" stroke="#8C8C8C" stroke-width="4.5" filter="url(#sh)"/>
  <!-- Right lens -->
  <rect x="460" y="260" width="225" height="120" rx="12" ry="12" fill="rgba(140,140,140,0.18)" stroke="#8C8C8C" stroke-width="4.5" filter="url(#sh)"/>
  <!-- Bridge -->
  <rect x="340" y="306" width="120" height="8" rx="4" fill="#8C8C8C"/>
  <!-- Left temple with cable wire detail -->
  <line x1="115" y1="315" x2="35" y2="325" stroke="#8C8C8C" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="100" y1="308" x2="35" y2="316" stroke="#8C8C8C" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" stroke-dasharray="4,3"/>
  <!-- Right temple -->
  <line x1="685" y1="315" x2="765" y2="325" stroke="#8C8C8C" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="700" y1="308" x2="765" y2="316" stroke="#8C8C8C" stroke-width="1.5" stroke-opacity="0.5" stroke-linecap="round" stroke-dasharray="4,3"/>
  <!-- Reflection -->
  <line x1="140" y1="276" x2="195" y2="273" stroke="white" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="485" y1="276" x2="540" y2="273" stroke="white" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/>
  </g>
</svg>