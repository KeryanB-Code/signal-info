<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F0EBE2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="430" rx="240" ry="22" fill="url(#shadow)"/>
  <!-- Glasses centered -->
  
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Left lens (teardrop aviator) -->
  <path d="M 148,270 Q 240,240 340,280 Q 355,310 340,345 Q 270,390 180,380 Q 120,360 120,320 Q 120,290 148,270 Z"
        fill="rgba(201,168,76,0.18)" stroke="url(#lg)" stroke-width="3" filter="url(#sh)"/>
  <!-- Right lens -->
  <path d="M 460,280 Q 560,240 652,270 Q 680,290 680,320 Q 680,360 620,380 Q 530,390 460,345 Q 445,310 460,280 Z"
        fill="rgba(201,168,76,0.18)" stroke="url(#lg)" stroke-width="3" filter="url(#sh)"/>
  <!-- Double bridge top -->
  <path d="M 340,278 Q 400,265 460,278" fill="none" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
  <!-- Double bridge bottom -->
  <path d="M 342,295 Q 400,283 458,295" fill="none" stroke="#C9A84C" stroke-width="2" stroke-linecap="round"/>
  <!-- Left temple -->
  <line x1="125" y1="315" x2="35" y2="330" stroke="#C9A84C" stroke-width="4" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="675" y1="315" x2="765" y2="330" stroke="#C9A84C" stroke-width="4" stroke-linecap="round"/>
  <!-- Reflection -->
  <line x1="165" y1="265" x2="215" y2="258" stroke="white" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="480" y1="258" x2="530" y2="265" stroke="white" stroke-width="1.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <!-- Product name -->
  <text x="400" y="530" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="12" letter-spacing="0.25em" fill="#8B6914" opacity="0.55" font-weight="300">Signature C CT0012S</text>
  <text x="400" y="550" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.4em" fill="#A0896A" opacity="0.45" font-weight="300">CARTIER</text>
</svg>