<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F0EBE2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="430" rx="240" ry="22" fill="url(#shadow)"/>
  <!-- Glasses centered -->
  
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B4226" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6B4226" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/></filter>
  </defs>
  <!-- Left lens -->
  <rect x="130" y="270" width="210" height="110" rx="6" ry="6" fill="rgba(107,66,38,0.18)" stroke="url(#lg)" stroke-width="3.5" filter="url(#sh)"/>
  <!-- Right lens -->
  <rect x="460" y="270" width="210" height="110" rx="6" ry="6" fill="rgba(107,66,38,0.18)" stroke="url(#lg)" stroke-width="3.5" filter="url(#sh)"/>
  <!-- Bridge -->
  <rect x="340" y="310" width="120" height="5" rx="2" fill="#6B4226"/>
  <!-- Left temple -->
  <line x1="130" y1="310" x2="40" y2="320" stroke="#6B4226" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="670" y1="310" x2="760" y2="320" stroke="#6B4226" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Nose pads -->
  <ellipse cx="350" cy="318" rx="5" ry="7" fill="#6B4226" opacity="0.8"/>
  <ellipse cx="450" cy="318" rx="5" ry="7" fill="#6B4226" opacity="0.8"/>
  <!-- Lens reflection -->
  <line x1="155" y1="285" x2="200" y2="282" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="485" y1="285" x2="530" y2="282" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- Product name -->
  <text x="400" y="530" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="12" letter-spacing="0.25em" fill="#8B6914" opacity="0.55" font-weight="300">Première de Cartier</text>
  <text x="400" y="550" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.4em" fill="#A0896A" opacity="0.45" font-weight="300">CARTIER</text>
</svg>