<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#EDE5D8"/>
      <stop offset="100%" stop-color="#D4C4B0"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E8D9C5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C4A882" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Subtle face glow -->
  <ellipse cx="400" cy="240" rx="200" ry="260" fill="url(#face)"/>
  <!-- Face silhouette (very subtle) -->
  <ellipse cx="400" cy="200" rx="140" ry="170" fill="#C9B49A" opacity="0.12"/>
  <!-- Neck -->
  <rect x="358" y="360" width="84" height="130" rx="42" fill="#C9B49A" opacity="0.10"/>
  <!-- Shoulders -->
  <path d="M 160,480 Q 280,430 400,440 Q 520,430 640,480 L 640,600 L 160,600 Z" fill="#C9B49A" opacity="0.10"/>
  <!-- Glasses -->
  <g transform="translate(0, 80)">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.2"/></filter>
  </defs>
  <!-- Single shield lens -->
  <path d="M 90,270 Q 200,240 400,242 Q 600,240 710,270 Q 730,300 710,350 Q 600,390 400,392 Q 200,390 90,350 Q 70,300 90,270 Z"
        fill="rgba(232,224,213,0.18)" stroke="#E8E0D5" stroke-width="5" filter="url(#sh)"/>
  <!-- Center divider (nose bridge integrated) -->
  <path d="M 370,242 Q 400,280 370,360" fill="none" stroke="#E8E0D5" stroke-width="3" opacity="0.4"/>
  <path d="M 430,242 Q 400,280 430,360" fill="none" stroke="#E8E0D5" stroke-width="3" opacity="0.4"/>
  <!-- Left temple -->
  <line x1="93" y1="305" x2="25" y2="320" stroke="#E8E0D5" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="707" y1="305" x2="775" y2="320" stroke="#E8E0D5" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Cable detail (Fred signature) -->
  <path d="M 93,295 Q 70,300 60,315" fill="none" stroke="#E8E0D5" stroke-width="2" stroke-dasharray="3,2" opacity="0.6"/>
  <!-- Reflection sweep -->
  <path d="M 130,265 Q 250,253 400,256 Q 550,253 670,265" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round"/></g>
  <!-- Brand name -->
  <text x="400" y="560" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="11" letter-spacing="0.3em" fill="#8B6914" opacity="0.7" font-weight="400">FRED</text>
  <!-- Subtle grain texture simulation via noise pattern -->
  <rect width="800" height="600" fill="url(#bg)" opacity="0.04"/>
</svg>