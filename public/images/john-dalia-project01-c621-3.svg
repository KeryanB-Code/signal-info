<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="35%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2A2520"/>
      <stop offset="100%" stop-color="#1A1614"/>
    </radialGradient>
    <radialGradient id="glow" cx="40%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#C4A882" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C4A882" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="340" cy="290" rx="320" ry="260" fill="url(#glow)"/>
  <!-- Glasses, slightly larger (scale 1.15 from center) -->
  <g transform="translate(400,300) scale(1.18) translate(-400,-300)">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B3A2A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6B3A2A" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.22"/></filter>
  </defs>
  <!-- Left lens (square thick) -->
  <rect x="118" y="255" width="220" height="175" rx="4" ry="4" fill="rgba(107,58,42,0.18)" stroke="url(#lg)" stroke-width="13" filter="url(#sh)"/>
  <!-- Right lens -->
  <rect x="462" y="255" width="220" height="175" rx="4" ry="4" fill="rgba(107,58,42,0.18)" stroke="url(#lg)" stroke-width="13" filter="url(#sh)"/>
  <!-- Bridge (slim) -->
  <rect x="338" y="326" width="124" height="10" rx="4" fill="#6B3A2A" opacity="0.9"/>
  <!-- Charnière titane gauche (barre métallique) -->
  <rect x="107" y="330" width="22" height="8" rx="2" fill="#B0B0B8" opacity="0.95"/>
  <!-- Charnière titane droite -->
  <rect x="671" y="330" width="22" height="8" rx="2" fill="#B0B0B8" opacity="0.95"/>
  <!-- Left temple -->
  <line x1="119" y1="338" x2="35" y2="348" stroke="#6B3A2A" stroke-width="11" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="681" y1="338" x2="765" y2="348" stroke="#6B3A2A" stroke-width="11" stroke-linecap="round"/>
  <!-- Lens reflection -->
  <line x1="146" y1="272" x2="205" y2="269" stroke="white" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="490" y1="272" x2="549" y2="269" stroke="white" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/></g>
  <!-- Brand signature bottom right -->
  <text x="740" y="576" text-anchor="end" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.35em" fill="#C4A882" opacity="0.6" font-weight="300">JOHN DALIA</text>
</svg>