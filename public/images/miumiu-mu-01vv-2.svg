<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F0EBE2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="430" rx="240" ry="22" fill="url(#shadow)"/>
  <!-- Glasses centered -->
  
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.22"/></filter>
  </defs>
  <!-- Left lens (butterfly: wide top, narrowing slightly to inner) -->
  <path d="M 80,275 Q 130,235 250,245 Q 340,252 360,300 Q 350,360 250,365 Q 140,368 80,340 Z"
        fill="rgba(212,160,168,0.18)" stroke="#D4A0A8" stroke-width="5.5" filter="url(#sh)"/>
  <!-- Right lens -->
  <path d="M 440,300 Q 460,252 550,245 Q 670,235 720,275 Q 720,340 660,365 Q 550,368 440,360 Z"
        fill="rgba(212,160,168,0.18)" stroke="#D4A0A8" stroke-width="5.5" filter="url(#sh)"/>
  <!-- Bridge -->
  <path d="M 360,300 Q 400,288 440,300" fill="none" stroke="#D4A0A8" stroke-width="4" stroke-linecap="round"/>
  <!-- Left temple -->
  <line x1="82" y1="308" x2="20" y2="325" stroke="#D4A0A8" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="718" y1="308" x2="780" y2="325" stroke="#D4A0A8" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Decorative hinge detail -->
  <circle cx="82" cy="308" r="6" fill="#D4A0A8"/>
  <circle cx="718" cy="308" r="6" fill="#D4A0A8"/>
  <!-- Reflection -->
  <line x1="115" y1="258" x2="175" y2="252" stroke="white" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="470" y1="258" x2="530" y2="252" stroke="white" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Product name -->
  <text x="400" y="530" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="12" letter-spacing="0.25em" fill="#8B6914" opacity="0.55" font-weight="300">MU 01VV</text>
  <text x="400" y="550" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.4em" fill="#A0896A" opacity="0.45" font-weight="300">MIU MIU</text>
</svg>