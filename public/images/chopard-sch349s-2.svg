<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F0EBE2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="430" rx="240" ry="22" fill="url(#shadow)"/>
  <!-- Glasses centered -->
  
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.14"/></filter>
  </defs>
  <!-- Left lens -->
  <ellipse cx="248" cy="308" rx="115" ry="75" fill="rgba(201,168,76,0.18)" stroke="#C9A84C" stroke-width="3" filter="url(#sh)"/>
  <!-- Right lens -->
  <ellipse cx="552" cy="308" rx="115" ry="75" fill="rgba(201,168,76,0.18)" stroke="#C9A84C" stroke-width="3" filter="url(#sh)"/>
  <!-- Bridge (thin) -->
  <path d="M 363,298 Q 400,288 437,298" fill="none" stroke="#C9A84C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left temple (thin) -->
  <line x1="133" y1="305" x2="40" y2="315" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="667" y1="305" x2="760" y2="315" stroke="#C9A84C" stroke-width="3" stroke-linecap="round"/>
  <!-- Nose pads -->
  <ellipse cx="372" cy="300" rx="3.5" ry="5" fill="#C9A84C" opacity="0.6"/>
  <ellipse cx="428" cy="300" rx="3.5" ry="5" fill="#C9A84C" opacity="0.6"/>
  <!-- Reflection -->
  <line x1="175" y1="285" x2="215" y2="280" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="479" y1="285" x2="519" y2="280" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- Product name -->
  <text x="400" y="530" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="12" letter-spacing="0.25em" fill="#8B6914" opacity="0.55" font-weight="300">Imperiale</text>
  <text x="400" y="550" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.4em" fill="#A0896A" opacity="0.45" font-weight="300">CHOPARD</text>
</svg>