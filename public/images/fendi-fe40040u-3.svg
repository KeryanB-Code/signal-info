<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="35%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2A2520"/>
      <stop offset="100%" stop-color="#1A1614"/>
    </radialGradient>
    <radialGradient id="glow" cx="40%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#C4A882" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C4A882" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="340" cy="290" rx="320" ry="260" fill="url(#glow)"/>
  <!-- Glasses, slightly larger (scale 1.15 from center) -->
  <g transform="translate(400,300) scale(1.18) translate(-400,-300)">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.22"/></filter>
  </defs>
  <!-- Left lens (butterfly: wide top, narrowing slightly to inner) -->
  <path d="M 80,275 Q 130,235 250,245 Q 340,252 360,300 Q 350,360 250,365 Q 140,368 80,340 Z"
        fill="rgba(139,90,58,0.18)" stroke="#8B5A3A" stroke-width="5.5" filter="url(#sh)"/>
  <!-- Right lens -->
  <path d="M 440,300 Q 460,252 550,245 Q 670,235 720,275 Q 720,340 660,365 Q 550,368 440,360 Z"
        fill="rgba(139,90,58,0.18)" stroke="#8B5A3A" stroke-width="5.5" filter="url(#sh)"/>
  <!-- Bridge -->
  <path d="M 360,300 Q 400,288 440,300" fill="none" stroke="#8B5A3A" stroke-width="4" stroke-linecap="round"/>
  <!-- Left temple -->
  <line x1="82" y1="308" x2="20" y2="325" stroke="#8B5A3A" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="718" y1="308" x2="780" y2="325" stroke="#8B5A3A" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Decorative hinge detail -->
  <circle cx="82" cy="308" r="6" fill="#8B5A3A"/>
  <circle cx="718" cy="308" r="6" fill="#8B5A3A"/>
  <!-- Reflection -->
  <line x1="115" y1="258" x2="175" y2="252" stroke="white" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="470" y1="258" x2="530" y2="252" stroke="white" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/></g>
  <!-- Brand signature bottom right -->
  <text x="740" y="576" text-anchor="end" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.35em" fill="#C4A882" opacity="0.6" font-weight="300">FENDI</text>
</svg>