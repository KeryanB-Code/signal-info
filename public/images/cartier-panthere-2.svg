<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F0EBE2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="430" rx="240" ry="22" fill="url(#shadow)"/>
  <!-- Glasses centered -->
  
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7B4A2D"/>
      <stop offset="100%" stop-color="#7B4A2D" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.2"/></filter>
  </defs>
  <!-- Left lens (cat-eye shape) -->
  <path d="M 130,310 Q 170,255 265,260 Q 340,263 355,305 Q 355,355 260,358 Q 175,358 130,340 Z"
        fill="rgba(123,74,45,0.18)" stroke="url(#lg)" stroke-width="5" stroke-linejoin="round" filter="url(#sh)"/>
  <!-- Right lens -->
  <path d="M 445,305 Q 460,263 535,260 Q 630,255 670,310 Q 670,340 625,358 Q 540,358 445,355 Z"
        fill="rgba(123,74,45,0.18)" stroke="url(#lg)" stroke-width="5" stroke-linejoin="round" filter="url(#sh)"/>
  <!-- Bridge -->
  <path d="M 355,305 Q 390,295 445,305" fill="none" stroke="#7B4A2D" stroke-width="4" stroke-linecap="round"/>
  <!-- Left temple -->
  <line x1="132" y1="325" x2="40" y2="340" stroke="#7B4A2D" stroke-width="5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="668" y1="325" x2="760" y2="340" stroke="#7B4A2D" stroke-width="5" stroke-linecap="round"/>
  <!-- Reflection -->
  <line x1="165" y1="278" x2="220" y2="272" stroke="white" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="475" y1="278" x2="530" y2="272" stroke="white" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Product name -->
  <text x="400" y="530" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="12" letter-spacing="0.25em" fill="#8B6914" opacity="0.55" font-weight="300">Panthère</text>
  <text x="400" y="550" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.4em" fill="#A0896A" opacity="0.45" font-weight="300">CARTIER</text>
</svg>