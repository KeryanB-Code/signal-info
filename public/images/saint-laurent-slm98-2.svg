<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="82%" r="38%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="390" rx="260" ry="18" fill="url(#shadow)"/>
  <!-- Glasses — scaled 1.5x from center to fill frame -->
  <g transform="translate(400,295) scale(1.5) translate(-400,-295)">
    
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B4A2D" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7B4A2D" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/></filter>
  </defs>
  <!-- Left lens -->
  <rect x="130" y="270" width="210" height="110" rx="6" ry="6" fill="rgba(123,74,45,0.18)" stroke="url(#lg)" stroke-width="3.5" filter="url(#sh)"/>
  <!-- Right lens -->
  <rect x="460" y="270" width="210" height="110" rx="6" ry="6" fill="rgba(123,74,45,0.18)" stroke="url(#lg)" stroke-width="3.5" filter="url(#sh)"/>
  <!-- Bridge -->
  <rect x="340" y="310" width="120" height="5" rx="2" fill="#7B4A2D"/>
  <!-- Left temple -->
  <line x1="130" y1="310" x2="40" y2="320" stroke="#7B4A2D" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="670" y1="310" x2="760" y2="320" stroke="#7B4A2D" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Nose pads -->
  <ellipse cx="350" cy="318" rx="5" ry="7" fill="#7B4A2D" opacity="0.8"/>
  <ellipse cx="450" cy="318" rx="5" ry="7" fill="#7B4A2D" opacity="0.8"/>
  <!-- Lens reflection -->
  <line x1="155" y1="285" x2="200" y2="282" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="485" y1="285" x2="530" y2="282" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  </g>
</svg>