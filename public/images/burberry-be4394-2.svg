<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="82%" r="38%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="390" rx="260" ry="18" fill="url(#shadow)"/>
  <!-- Glasses — scaled 1.5x from center to fill frame -->
  <g transform="translate(400,295) scale(1.5) translate(-400,-295)">
    
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Left lens (circle) -->
  <circle cx="248" cy="308" r="105" fill="rgba(107,58,42,0.18)" stroke="#6B3A2A" stroke-width="5" filter="url(#sh)"/>
  <!-- Right lens -->
  <circle cx="552" cy="308" r="105" fill="rgba(107,58,42,0.18)" stroke="#6B3A2A" stroke-width="5" filter="url(#sh)"/>
  <!-- Bridge -->
  <path d="M 353,295 Q 400,280 447,295" fill="none" stroke="#6B3A2A" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left temple -->
  <line x1="144" y1="308" x2="40" y2="320" stroke="#6B3A2A" stroke-width="5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="656" y1="308" x2="760" y2="320" stroke="#6B3A2A" stroke-width="5" stroke-linecap="round"/>
  <!-- Nose pads -->
  <ellipse cx="365" cy="302" rx="5" ry="7" fill="#6B3A2A" opacity="0.7"/>
  <ellipse cx="435" cy="302" rx="5" ry="7" fill="#6B3A2A" opacity="0.7"/>
  <!-- Reflection arc -->
  <path d="M 190,280 Q 215,265 245,278" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M 494,280 Q 519,265 549,278" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/>
  </g>
</svg>