<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#EDE5D8"/>
      <stop offset="100%" stop-color="#D4C4B0"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E8D9C5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C4A882" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Subtle face glow -->
  <ellipse cx="400" cy="240" rx="200" ry="260" fill="url(#face)"/>
  <!-- Face silhouette (very subtle) -->
  <ellipse cx="400" cy="200" rx="140" ry="170" fill="#C9B49A" opacity="0.12"/>
  <!-- Neck -->
  <rect x="358" y="360" width="84" height="130" rx="42" fill="#C9B49A" opacity="0.10"/>
  <!-- Shoulders -->
  <path d="M 160,480 Q 280,430 400,440 Q 520,430 640,480 L 640,600 L 160,600 Z" fill="#C9B49A" opacity="0.10"/>
  <!-- Glasses -->
  <g transform="translate(0, 80)">
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555560" stop-opacity="1"/>
      <stop offset="100%" stop-color="#555560" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15"/></filter>
  </defs>
  <!-- Left lens -->
  <rect x="130" y="270" width="210" height="110" rx="6" ry="6" fill="rgba(85,85,96,0.18)" stroke="url(#lg)" stroke-width="3.5" filter="url(#sh)"/>
  <!-- Right lens -->
  <rect x="460" y="270" width="210" height="110" rx="6" ry="6" fill="rgba(85,85,96,0.18)" stroke="url(#lg)" stroke-width="3.5" filter="url(#sh)"/>
  <!-- Bridge -->
  <rect x="340" y="310" width="120" height="5" rx="2" fill="#555560"/>
  <!-- Left temple -->
  <line x1="130" y1="310" x2="40" y2="320" stroke="#555560" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="670" y1="310" x2="760" y2="320" stroke="#555560" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Nose pads -->
  <ellipse cx="350" cy="318" rx="5" ry="7" fill="#555560" opacity="0.8"/>
  <ellipse cx="450" cy="318" rx="5" ry="7" fill="#555560" opacity="0.8"/>
  <!-- Lens reflection -->
  <line x1="155" y1="285" x2="200" y2="282" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="485" y1="285" x2="530" y2="282" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/></g>
  <!-- Brand name -->
  <text x="400" y="560" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="11" letter-spacing="0.3em" fill="#8B6914" opacity="0.7" font-weight="400">JOHN DALIA</text>
  <!-- Subtle grain texture simulation via noise pattern -->
  <rect width="800" height="600" fill="url(#bg)" opacity="0.04"/>
</svg>