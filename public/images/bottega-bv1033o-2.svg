<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="82%" r="38%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="390" rx="260" ry="18" fill="url(#shadow)"/>
  <!-- Glasses — scaled 1.5x from center to fill frame -->
  <g transform="translate(400,295) scale(1.5) translate(-400,-295)">
    
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.14"/></filter>
  </defs>
  <!-- Left lens -->
  <ellipse cx="248" cy="308" rx="115" ry="75" fill="rgba(107,58,42,0.18)" stroke="#6B3A2A" stroke-width="3" filter="url(#sh)"/>
  <!-- Right lens -->
  <ellipse cx="552" cy="308" rx="115" ry="75" fill="rgba(107,58,42,0.18)" stroke="#6B3A2A" stroke-width="3" filter="url(#sh)"/>
  <!-- Bridge (thin) -->
  <path d="M 363,298 Q 400,288 437,298" fill="none" stroke="#6B3A2A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left temple (thin) -->
  <line x1="133" y1="305" x2="40" y2="315" stroke="#6B3A2A" stroke-width="3" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="667" y1="305" x2="760" y2="315" stroke="#6B3A2A" stroke-width="3" stroke-linecap="round"/>
  <!-- Nose pads -->
  <ellipse cx="372" cy="300" rx="3.5" ry="5" fill="#6B3A2A" opacity="0.6"/>
  <ellipse cx="428" cy="300" rx="3.5" ry="5" fill="#6B3A2A" opacity="0.6"/>
  <!-- Reflection -->
  <line x1="175" y1="285" x2="215" y2="280" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="479" y1="285" x2="519" y2="280" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  </g>
</svg>