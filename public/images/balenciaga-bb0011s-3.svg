<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="35%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2A2520"/>
      <stop offset="100%" stop-color="#1A1614"/>
    </radialGradient>
    <radialGradient id="glow" cx="40%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#C4A882" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C4A882" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="340" cy="290" rx="320" ry="260" fill="url(#glow)"/>
  <!-- Glasses, slightly larger (scale 1.15 from center) -->
  <g transform="translate(400,300) scale(1.18) translate(-400,-300)">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.14"/></filter>
  </defs>
  <!-- Left lens -->
  <ellipse cx="248" cy="308" rx="115" ry="75" fill="rgba(28,28,30,0.18)" stroke="#1C1C1E" stroke-width="3" filter="url(#sh)"/>
  <!-- Right lens -->
  <ellipse cx="552" cy="308" rx="115" ry="75" fill="rgba(28,28,30,0.18)" stroke="#1C1C1E" stroke-width="3" filter="url(#sh)"/>
  <!-- Bridge (thin) -->
  <path d="M 363,298 Q 400,288 437,298" fill="none" stroke="#1C1C1E" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left temple (thin) -->
  <line x1="133" y1="305" x2="40" y2="315" stroke="#1C1C1E" stroke-width="3" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="667" y1="305" x2="760" y2="315" stroke="#1C1C1E" stroke-width="3" stroke-linecap="round"/>
  <!-- Nose pads -->
  <ellipse cx="372" cy="300" rx="3.5" ry="5" fill="#1C1C1E" opacity="0.6"/>
  <ellipse cx="428" cy="300" rx="3.5" ry="5" fill="#1C1C1E" opacity="0.6"/>
  <!-- Reflection -->
  <line x1="175" y1="285" x2="215" y2="280" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/>
  <line x1="479" y1="285" x2="519" y2="280" stroke="white" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round"/></g>
  <!-- Brand signature bottom right -->
  <text x="740" y="576" text-anchor="end" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.35em" fill="#C4A882" opacity="0.6" font-weight="300">BALENCIAGA</text>
</svg>