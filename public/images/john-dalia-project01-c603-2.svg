<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F0EBE2"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1A1A1A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Ground shadow -->
  <ellipse cx="400" cy="430" rx="240" ry="22" fill="url(#shadow)"/>
  <!-- Glasses centered -->
  
  <defs>
    <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1C1E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1C1C1E" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.22"/></filter>
  </defs>
  <!-- Left lens (square thick) -->
  <rect x="118" y="255" width="220" height="175" rx="4" ry="4" fill="rgba(28,28,30,0.18)" stroke="url(#lg)" stroke-width="13" filter="url(#sh)"/>
  <!-- Right lens -->
  <rect x="462" y="255" width="220" height="175" rx="4" ry="4" fill="rgba(28,28,30,0.18)" stroke="url(#lg)" stroke-width="13" filter="url(#sh)"/>
  <!-- Bridge (slim) -->
  <rect x="338" y="326" width="124" height="10" rx="4" fill="#1C1C1E" opacity="0.9"/>
  <!-- Charnière titane gauche (barre métallique) -->
  <rect x="107" y="330" width="22" height="8" rx="2" fill="#B0B0B8" opacity="0.95"/>
  <!-- Charnière titane droite -->
  <rect x="671" y="330" width="22" height="8" rx="2" fill="#B0B0B8" opacity="0.95"/>
  <!-- Left temple -->
  <line x1="119" y1="338" x2="35" y2="348" stroke="#1C1C1E" stroke-width="11" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="681" y1="338" x2="765" y2="348" stroke="#1C1C1E" stroke-width="11" stroke-linecap="round"/>
  <!-- Lens reflection -->
  <line x1="146" y1="272" x2="205" y2="269" stroke="white" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <line x1="490" y1="272" x2="549" y2="269" stroke="white" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <!-- Product name -->
  <text x="400" y="530" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="12" letter-spacing="0.25em" fill="#8B6914" opacity="0.55" font-weight="300">Project 01 C603</text>
  <text x="400" y="550" text-anchor="middle" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.4em" fill="#A0896A" opacity="0.45" font-weight="300">JOHN DALIA</text>
</svg>