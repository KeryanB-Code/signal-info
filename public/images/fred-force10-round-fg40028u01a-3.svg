<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bg" cx="35%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2A2520"/>
      <stop offset="100%" stop-color="#1A1614"/>
    </radialGradient>
    <radialGradient id="glow" cx="40%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#C4A882" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C4A882" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="340" cy="290" rx="320" ry="260" fill="url(#glow)"/>
  <!-- Glasses, slightly larger (scale 1.15 from center) -->
  <g transform="translate(400,300) scale(1.18) translate(-400,-300)">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.18"/></filter>
  </defs>
  <!-- Left lens (circle) -->
  <circle cx="248" cy="308" r="105" fill="rgba(28,28,30,0.18)" stroke="#1C1C1E" stroke-width="5" filter="url(#sh)"/>
  <!-- Right lens -->
  <circle cx="552" cy="308" r="105" fill="rgba(28,28,30,0.18)" stroke="#1C1C1E" stroke-width="5" filter="url(#sh)"/>
  <!-- Bridge -->
  <path d="M 353,295 Q 400,280 447,295" fill="none" stroke="#1C1C1E" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left temple -->
  <line x1="144" y1="308" x2="40" y2="320" stroke="#1C1C1E" stroke-width="5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="656" y1="308" x2="760" y2="320" stroke="#1C1C1E" stroke-width="5" stroke-linecap="round"/>
  <!-- Nose pads -->
  <ellipse cx="365" cy="302" rx="5" ry="7" fill="#1C1C1E" opacity="0.7"/>
  <ellipse cx="435" cy="302" rx="5" ry="7" fill="#1C1C1E" opacity="0.7"/>
  <!-- Reflection arc -->
  <path d="M 190,280 Q 215,265 245,278" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/>
  <path d="M 494,280 Q 519,265 549,278" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.55" stroke-linecap="round"/></g>
  <!-- Brand signature bottom right -->
  <text x="740" y="576" text-anchor="end" font-family="Garamond, Georgia, serif" font-size="10" letter-spacing="0.35em" fill="#C4A882" opacity="0.6" font-weight="300">FRED</text>
</svg>